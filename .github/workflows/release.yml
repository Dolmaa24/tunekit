name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token, no stored secret.
# PyPI must have a publisher configured for this repo + workflow filename first:
#   existing project -> pypi.org/manage/project/<name>/settings/publishing/
#   new project      -> pypi.org/manage/account/publishing/  ("pending publisher")
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required: mints the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
