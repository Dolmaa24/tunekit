name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the latest upstream releases (there is no lockfile),
    # so an API rename in a dependency shows up here before a user hits it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Unit tests (offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -m "not integration" -q
      - name: Integration smoke test (downloads a 135M model)
        if: matrix.python-version == '3.12'
        run: uv run pytest -m integration -q
