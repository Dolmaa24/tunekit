[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunekit"
version = "0.1.0"
description = "One-command LoRA/QLoRA fine-tuning for open LLMs. Config-driven, GPU-friendly, exports to GGUF/Ollama."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "tunekit contributors" }]
keywords = ["fine-tuning", "lora", "qlora", "llm", "peft", "trl", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=2.20",
    "accelerate>=0.34",
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# 4-bit / 8-bit quantised training (QLoRA). Linux + NVIDIA only.
quant = ["bitsandbytes>=0.43"]
# Experiment tracking backends.
wandb = ["wandb"]
tensorboard = ["tensorboard"]
# Pushing to / pulling from the Hugging Face Hub.
hub = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov"]

[project.scripts]
tunekit = "tunekit.cli:app"

[project.urls]
Homepage = "https://github.com/Dolmaa24/tunekit"
Issues = "https://github.com/Dolmaa24/tunekit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tunekit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs network access and downloads a small model (deselect with '-m \"not integration\"')",
]
